on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3 # Clona o repositório
    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - run: npm ci # Instala dependências
    - run: npm test # Roda os testes
